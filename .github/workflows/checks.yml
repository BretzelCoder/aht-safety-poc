# Vérifications automatiques (spec 001) : les mêmes que « npm test » en local.
# Le résultat apparaît sur chaque commit et chaque pull request ; il n'empêche pas la fusion (décision du propriétaire).
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Une seule version de Node : celle que le projet annonce (engines >=24), voir la spec 003.
    name: Checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium seulement, mis en cache : la clé suit le fichier de verrouillage, donc la version de Playwright.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Tests dans le navigateur et contrôles statiques, puis vérification des liens (avertissements seulement).
      - run: npm test
